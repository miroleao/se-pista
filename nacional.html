<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SE/Nacional 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: arena de pista — barra de abas fixa, conteúdo em coluna larga; a "brinco" amarela marca RGs e títulos */
:root{
  --paper:#FFFFFF; --paper-2:#F1F2EF; --paper-3:#E6E8E3; --ink:#16181C; --ink-60:#5C6067; --ink-40:#8A8F95;
  --plate:#0E0F12; --plate-ink:#F4F5F2; --tag:#F5C518; --tag-ink:#16181C; --rule:#DCDDD8;
  --nac:#1F4E5F; --nac-soft:#DCE8EC; --int:#6A4C93; --int-soft:#E9E2F2; --reg:#A0601C; --reg-soft:#F4E6D4;
  --fem:#4A5A38; --mac:#1F4E5F; --se:#B3261E; --se-soft:#F7E1DF; --segr:#1E7A46; --n1:#D62828; --n2:#E9A800; --n3:#1F6FEB; --n4:#6B7280; --n5:#7B3FBF; --r1:#D62828; --r2:#E9A800; --r3:#1F6FEB; --r4:#6B7280; --r5:#7B3FBF; --r6:#8B5A2B; --good:#2F6B34; --bad:#9A3B2A;
  --f-disp:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gut:clamp(16px,3vw,32px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121416; --paper-2:#1A1D20; --paper-3:#24282C; --ink:#ECEDE9; --ink-60:#A6ABB1; --ink-40:#7C8288; --plate:#050607; --plate-ink:#F4F5F2;
  --rule:#2E3337; --nac:#86BACB; --nac-soft:#1D3038; --int:#B9A2E0; --int-soft:#2E2540; --reg:#E3A35E; --reg-soft:#3A2A18; --fem:#A9C08A; --mac:#86BACB;
  --se:#F08A80; --se-soft:#3D1F1C; --segr:#4CC27F; --n1:#FF6B6B; --n2:#FFD23F; --n3:#6EA8FF; --n4:#A3A9B3; --n5:#C39BFF; --r1:#FF6B6B; --r2:#FFD23F; --r3:#6EA8FF; --r4:#A3A9B3; --r5:#C39BFF; --r6:#D29A62; --good:#7FC486; --bad:#EE8F7C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121416; --paper-2:#1A1D20; --paper-3:#24282C; --ink:#ECEDE9; --ink-60:#A6ABB1; --ink-40:#7C8288; --plate:#050607; --plate-ink:#F4F5F2;
  --rule:#2E3337; --nac:#86BACB; --nac-soft:#1D3038; --int:#B9A2E0; --int-soft:#2E2540; --reg:#E3A35E; --reg-soft:#3A2A18; --fem:#A9C08A; --mac:#86BACB;
  --se:#F08A80; --se-soft:#3D1F1C; --segr:#4CC27F; --n1:#FF6B6B; --n2:#FFD23F; --n3:#6EA8FF; --n4:#A3A9B3; --n5:#C39BFF; --r1:#FF6B6B; --r2:#FFD23F; --r3:#6EA8FF; --r4:#A3A9B3; --r5:#C39BFF; --r6:#D29A62; --good:#7FC486; --bad:#EE8F7C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-disp);letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(1.35rem,2.6vw,1.8rem);font-weight:800}
h3{font-size:1.1rem;font-weight:700}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-60)}
.muted{color:var(--ink-60)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:var(--gut)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--plate);color:var(--plate-ink)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .tagmark{width:30px;height:36px;flex:none}
.brand h1{font-size:1.15rem;font-weight:800;color:var(--plate-ink)}
.brand p{margin:0;font-size:.72rem;color:#A9AEB4;font-family:var(--f-mono);letter-spacing:.06em}
.tabs{display:flex;gap:2px;overflow-x:auto;width:100%;scrollbar-width:none;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:#B9BDC2;padding:10px 12px 11px;font-size:.86rem;font-weight:600;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--tag)}
.tabs button:hover{color:#fff}

main{padding-block:22px 60px}
section.view{display:grid;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.head p{margin:6px 0 0;max-width:68ch;color:var(--ink-60)}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink-60)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
input[type=search],input[type=text],input[type=date],input[type=number],select{border:1.5px solid var(--rule);background:var(--paper);border-radius:8px;padding:7px 10px;font-size:.88rem;min-width:0}
input[type=search]{min-width:min(280px,100%)}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:7px 14px;font-weight:700;font-size:.86rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:4px 10px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--ink-40);text-underline-offset:2px;text-align:left}
.link:hover{text-decoration-color:var(--ink)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap}
.pill.chip{white-space:normal;text-align:left;max-width:100%}
.pill.N{background:var(--nac-soft);color:var(--nac)}
.pill.I{background:var(--int-soft);color:var(--int)}
.pill.R{background:var(--reg-soft);color:var(--reg)}
.pill.cat{background:var(--paper-2);color:var(--ink-60)}
.pill.se{background:var(--se-soft);color:var(--se)}
.pill.est{background:var(--paper-3);color:var(--ink-60)}
.rg{font-family:var(--f-mono);font-size:.78rem;background:var(--tag);color:var(--tag-ink);padding:1px 6px 1px 7px;border-radius:3px 9px 9px 3px;white-space:nowrap;font-weight:500}
.medal{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border-radius:50%;font-family:var(--f-mono);font-size:.74rem;font-weight:700;background:var(--paper-2);color:var(--ink)}
.medal.p1{background:var(--tag);color:var(--tag-ink)}
.medal.p2{background:var(--paper-3)}
.medal.p3{background:var(--reg-soft);color:var(--reg)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.kpi{background:var(--paper);padding:14px 16px}
.kpi .v{font-family:var(--f-disp);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.2rem);line-height:1;letter-spacing:-.03em}
.kpi .k{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-60);margin-top:6px}
.kpi .s{font-size:.8rem;color:var(--ink-60);margin-top:4px}

.panel{border:1px solid var(--rule);border-radius:10px;padding:16px;background:var(--paper);min-width:0}
.panel.alt{background:var(--paper-2);border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.stack{display:grid;gap:10px;min-width:0}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-60);text-align:left;font-weight:500;padding:9px 10px;border-bottom:1.5px solid var(--rule);white-space:nowrap;background:var(--paper-2);position:sticky;top:0}
th.s{cursor:pointer}
th.s:hover{color:var(--ink)}
th.r,td.r{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--paper-2)}
tr.se td{background:var(--se-soft)}
td.nm{font-weight:600;min-width:180px}
td .sub{display:block;font-size:.76rem;color:var(--ink-60);font-weight:400}
.empty{padding:22px;text-align:center;color:var(--ink-60)}

details.cls{border-top:1px solid var(--rule)}
details.cls>summary{cursor:pointer;padding:10px 2px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.cls>summary::-webkit-details-marker{display:none}
details.cls>summary::before{content:"+";font-family:var(--f-mono);width:1em;color:var(--ink-60)}
details.cls[open]>summary::before{content:"–"}

/* champion cards */
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.ch{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.ch.gr{background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
.ch.gr .muted{color:#A9AEB4}
.ch .t{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60)}
.ch.gr .t{color:var(--tag)}
.ch .n{font-family:var(--f-disp);font-weight:700;font-size:1.05rem}

.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--ink-60)}
.chart .grid{stroke:var(--rule);stroke-width:1}
.lc{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--paper)}
.lc.se{background:var(--se-soft);border-color:transparent}
.lc .ct{font-family:var(--f-disp);font-weight:800;font-size:1.7rem;line-height:1;min-width:2.4ch;text-align:center;background:var(--plate);color:var(--plate-ink);border-radius:8px;padding:8px 8px 6px}
tr.me td{background:color-mix(in srgb,var(--tag) 22%,transparent)}
.lc .ln1{font-weight:700;font-size:1rem}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--ink-60)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.legend i.ln{height:3px;border-radius:2px;width:18px;vertical-align:3px}

.note{font-size:.84rem;color:var(--ink-60);max-width:75ch;margin:0}
.callout{border-left:4px solid var(--tag);background:var(--paper-2);padding:12px 14px;border-radius:0 8px 8px 0;font-size:.88rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 18px}
.facts div b{display:block;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-60);font-weight:500}
.facts div span{font-weight:600}
.ped{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.ped b{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-60);font-weight:500;align-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:.86rem;z-index:50}
.status{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-60)}
.bar{height:8px;border-radius:4px;background:var(--paper-3);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--nac)}
.delta-up{color:var(--good)}.delta-dn{color:var(--bad)}
form.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
form.inline label{display:grid;gap:3px;font-size:.72rem;color:var(--ink-60);font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
table.cmp td .nn{font-size:.7em;color:var(--ink-60);margin-left:.3em}
table.cmp td{white-space:nowrap}
table.cmp th .sub{display:block;font-size:.62rem;letter-spacing:.04em;margin-top:2px}
table.cmp th button.link{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:.78rem;font-weight:700;color:var(--ink)}
.regcol{background:color-mix(in srgb,var(--reg-soft) 45%,transparent)}
.avgcol{background:var(--paper-2)}
.intcol{background:color-mix(in srgb,var(--int-soft) 50%,transparent)}
.sepL{border-left:1.5px solid var(--rule)}
.searchbar{display:flex}
.searchbar input{flex:1;max-width:520px;font-size:17px;padding:12px 14px;border-radius:10px;border-width:2px}
@media (max-width:640px){
  td.nm{min-width:150px} .kpi{padding:12px}
  input[type=search],input[type=text],input[type=date],input[type=number],select{font-size:16px}
  .brand p{display:none} .top .wrap{padding-block:8px 0} .tabs button{padding:9px 10px 10px}
  main{padding-block:16px 48px}
  .searchbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,92px));z-index:10;background:var(--paper);padding-block:6px;margin-block:-6px}
  .searchbar input{max-width:none}
  .tw:has(table.cards){border:0;border-radius:0;overflow:visible}
  table.cards thead{display:none}
  table.cards,table.cards tbody{display:block}
  table.cards tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;padding:12px 12px;border:1px solid var(--rule);border-radius:10px;margin-bottom:8px}
  table.cards td{display:block;border:0;padding:0;min-width:0;text-align:left!important}
  table.cards td.full{grid-column:1/-1}
  table.cards td.hm{display:none}
  table.cards td.nm{min-width:0;font-size:1rem}
  table.cards td[data-l]::before{content:attr(data-l);display:block;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-60);margin-bottom:1px}
  table.cards td.empty{grid-column:1/-1}
  .ped{grid-template-columns:1fr} .ped b{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style id="camp-full">
.camptg{font-weight:700;font-size:inherit;text-decoration-style:dotted}
td .camptg + .sub{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.04em}
tr.cldet td{background:var(--paper-2);padding:10px 12px}
ol.clist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:6px 18px}
ol.clist li{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:start;font-size:.86rem;line-height:1.3}
ol.clist li .sub{grid-column:2;font-size:.74rem;color:var(--ink-60)}
ol.clist .medal,table.cards ol.clist .medal{min-width:2.2em;height:1.6em;font-size:.68rem;flex:none}
@media (max-width:640px){table.cards tr.cldet{display:block;padding:8px 10px;background:var(--paper-2);margin-top:-4px}table.cards tr.cldet[hidden]{display:none}table.cards tr.cldet td.full:last-child{padding:0;background:none;color:var(--ink);font-size:.86rem;margin:0}}
</style>
<style id="rk-off">
.rktabs{display:flex;border-radius:12px}
.rktabs button{white-space:nowrap}
.rkcalc .head{display:none}
@media (max-width:640px){table.cards.rk tr td[data-l="Pos."]:first-child{position:absolute;top:8px;right:11px;font-size:.8rem}table.cards.rk tr td[data-l="Pos."]:first-child::before{display:none}table.cards.rk tr td[data-l="Pos."]:first-child + td{padding-right:40px}}
</style>
<style id="rk-live">
@media (max-width:640px){table.rk tr{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
<style id="fx-group">
.fxcat{margin:18px 0 2px}
.fxcat:first-child{margin-top:4px}
.fxwin{margin-left:auto;font-size:.82rem}
@media (max-width:640px){.fxwin{margin-left:0;flex-basis:100%;padding-left:1.6em}}
</style>
<style id="pm-jv">
td.nm .pm{display:block;font-size:.74rem;font-weight:400;color:var(--ink-60);margin-top:1px;line-height:1.25}
td .jv{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-60);white-space:nowrap;letter-spacing:.02em}
@media (max-width:640px){table.cards td.nm .pm{font-size:.7rem}table.cards td .jv{font-size:.66rem}}
</style>
<style id="reorder">
details.catg>.gbody{padding:0 0 10px 18px}
details.cls>summary .muted.num{font-size:.8rem}
details.catg>.gbody details.cls:first-child{border-top:0}
details.cpd .body ol.clist{background:var(--paper-2);border-radius:8px;padding:10px 12px}
@media (max-width:640px){details.catg>.gbody{padding-left:8px}}
</style>
<style id="subd">
details.subd{border-top:1px dashed var(--rule)}
details.subd:first-child{border-top:0}
details.subd>summary{cursor:pointer;padding:8px 2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none;font-size:.9rem}
details.subd>summary::-webkit-details-marker{display:none}
details.subd>summary::before{content:"+";font-family:var(--f-mono);width:1em;color:var(--ink-60)}
details.subd[open]>summary::before{content:"–"}
details.subd>.sbody{padding:2px 0 10px}
details.cls>.body{padding-left:14px}
@media (max-width:640px){details.cls>.body{padding-left:4px}}
</style>
<style id="ttl">
.ttl{display:inline-block;font-family:var(--f-disp);font-weight:800;font-size:.8rem;line-height:1.15;padding:3px 9px;border-radius:6px;letter-spacing:-.005em;white-space:normal;text-align:left}
.ttl.t1{background:var(--tag);color:var(--tag-ink)}
.ttl.t2{background:#D5D9DF;color:#16181C}
.ttl.t3{background:#E8C29A;color:#3E2207}
.ttl.gr{background:var(--plate);color:var(--tag);box-shadow:inset 0 0 0 1.5px var(--tag)}
.ttl.gr.t2{color:#E6E9ED;box-shadow:inset 0 0 0 1.5px #B9BEC6}
.ttl.gr.t3{color:#F0C9A0;box-shadow:inset 0 0 0 1.5px #C9925C}
.ttls{display:flex;flex-wrap:wrap;gap:5px;margin:3px 0 1px}
td .ttls{margin:4px 0 2px}
tr.ttlrow td{background:color-mix(in srgb,var(--tag) 13%,transparent)}
@media (max-width:640px){table.cards tr.ttlrow{border:2px solid var(--tag);background:color-mix(in srgb,var(--tag) 9%,var(--paper))}table.cards tr.ttlrow td{background:none}}
</style>
<style id="compact-cards">
/* cartões compactos no celular: selo no canto, números numa linha só */
@media (max-width:640px){
  table.cards tr{position:relative;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 10px;padding:8px 11px;margin-bottom:6px;border-radius:8px}
  table.cards td{font-size:.86rem;line-height:1.3}
  table.cards td[data-l]::before{font-size:.54rem;letter-spacing:.08em;margin-bottom:0}

<script>

const ttlSort=(a,b)=>((b[0]==='GRANDE')-(a[0]==='GRANDE'))||a[1]-b[1];
function ttlB(cat,l,lab){return `<span class="ttl t${l}${cat==='GRANDE'?' gr':''}">${cat==='GRANDE'?'★ ':''}${esc(lab)}</span>`}
function liveTT(ct){const o=[];for(const [k,v] of Object.entries(LIVE.camp||{})){const [sx,cat]=k.split('|');(v.l||[]).forEach(([l,c])=>{if(c===ct&&l<=3)o.push([cat,l,sx])})}o.sort(ttlSort);return o.length?`<span class="ttls">${o.map(([cat,l,sx])=>ttlB(cat,l,titleOf(cat,l,sx))).join('')}</span>`:''}
function liveTitles(ct){const out=[];for(const [k,o] of Object.entries(LIVE.camp||{})){const [sx,cat]=k.split('|');(o.l||[]).forEach(([l,c])=>{if(c===ct&&l<=3)out.push(titleOf(cat,l,sx))})}return out}

const favSave=()=>{try{localStorage.setItem(FKEY,JSON.stringify([...FAV]))}catch(e){}};

function favSec(){const rows=favRows();if(!rows.length)return `<div class="favnone"><span class="favh">☆ Favoritos</span><span class="muted">Toque na estrela ☆ ao lado de um animal para acompanhá-lo aqui.</span></div>`;

function status(r){const p=POS.get(r[9]);return p?`${medal(p)} <b class="num">de ${NC.get(r[9])}</b>`:AUS.has(r[9])?'<span class="pill est">ausente</span>':LIVE.subs[subKey(r)]?'<span class="pill est">sem colocação</span>':'<span class="pill cat">aguardando julgamento</span>'}
function card(r){const a=A[r[0]];const md=REF[a[2]+ageBin(r[6])];const nt=NOTA.get(r[9]);const tl=liveTitles(r[9]);

    <p>Resultados entrando subdivisão por subdivisão, conforme a organizadora divulga. Busque pelo <b>número do catálogo</b>, nome, RGD, <b>expositor ou criador</b> — no animal aparecem os dados do animal, o histórico em pistas anteriores, a subcategoria completa e os campeonatos.</p></div></div>
  <div class="kpis"><div class="kpi"><div class="v num">${done.length}<span style="font-size:.5em;color:var(--ink-60)"> / ${keys.length}</span></div><div class="k">Subdivisões julgadas</div></div>
    <div class="kpi"><div class="v num">${camps.length}<span style="font-size:.5em;color:var(--ink-60)"> / ${cats.size+2}</span></div><div class="k">Campeonatos divulgados</div></div>
    <div class="kpi"><div class="v num">${K.length}</div><div class="k">Inscritos</div><div class="s">${EV.nf} fêmeas · ${EV.nm} machos</div></div>
    <div class="kpi"><div class="v num" style="font-size:1.2rem">${esc(LIVE.upd||'—')}</div><div class="k">Última atualização</div></div></div>
  <div class="searchbar"><input type="search" id="q" inputmode="search" placeholder="Nº do catálogo, animal, RGD, expositor, criador ou ★" value="${esc(ST.q)}" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar animal"></div>
  <div id="res" class="stack">${search(ST.q)}</div>
  <div id="favSec">${favSec()}</div>
  <div class="stack"><div class="head"><h3>Últimos resultados</h3><div class="ctl">
    <div class="seg" id="fS">${[['T','Todos'],['F','Fêmeas'],['M','Machos']].map(([k,l])=>`<button data-k="${k}" aria-pressed="${ST.sx===k}">${l}</button>`).join('')}</div></div></div>
  <p class="note" style="margin-top:-4px">Do mais recente para o mais antigo. Toque para abrir.</p>
  <div>${recentSec()}</div></div>
  <div class="stack"><div class="head"><h3>Aguardando julgamento</h3></div>
  <p class="note" style="margin-top:-4px">Agrupado por categoria. Toque para ver as faixas e os inscritos.</p>
  <div>${pendSec()}</div></div>
  ${rankPanel()}
  <p class="note">Fonte: catálogo de conferência e PDFs de resultado da organizadora (sistema JulgamentoACNB). Peso comparado com a mediana das exposições nacionais de 2024 em diante na mesma faixa de idade. Os resultados podem conter erros de digitação da fonte; o oficial é o da ACNB.</p>`}
function render(){$('#main').innerHTML=`<section class="view">${view()}</section>`;bind()}
function openCt(ct){ST.q=String(ct);$('#q').value=ST.q;$('#res').innerHTML=search(ST.q);const y=$('#res').getBoundingClientRect().top+scrollY-(document.querySelector('.top').offsetHeight+80);scrollTo({top:Math.max(0,y),behavior:'smooth'})}
function bind(){const q=$('#q');q.oninput=()=>{ST.q=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{$('#res').innerHTML=search(ST.q)},150)};q.onkeydown=e=>{if(e.key==='Enter')q.blur()};
  const seg=(id,k)=>$(id).onclick=e=>{const x=e.target.closest('button');if(x){ST[k]=x.dataset.k;const y=scrollY;render();scrollTo({top:y})}};seg('#fS','sx');
  document.querySelectorAll('details.cls').forEach(d=>d.addEventListener('toggle',()=>{if(d.open&&d.dataset.fx){const b=d.querySelector('.body');if(b&&!b.innerHTML)b.innerHTML=fxBody(+d.dataset.fx)}}))}
document.addEventListener('click',e=>{const rq=e.target.closest('[data-rq]');if(rq){e.preventDefault();ST.q=rq.dataset.rq;$('#q').value=ST.q;$('#res').innerHTML=search(ST.q);const y=$('#res').getBoundingClientRect().top+scrollY-(document.querySelector('.top').offsetHeight+80);scrollTo({top:Math.max(0,y),behavior:'smooth'});return}const ro=e.target.closest('[data-rko]');if(ro){RKO[ro.dataset.rko]=!RKO[ro.dataset.rko];const y=scrollY;$('#rkPanel').outerHTML=rankPanel();scrollTo({top:y});return}const g=e.target.closest('.camptg');if(g){e.preventDefault();const k=g.dataset.ck;const op=!CKO.has(k);op?CKO.add(k):CKO.delete(k);const d=[...document.querySelectorAll('tr.cldet')].find(x=>x.dataset.ck===k);if(d)d.hidden=!op;g.setAttribute('aria-expanded',op);const sb=g.nextElementSibling;if(sb)sb.textContent=sb.textContent.replace(op?'+ classificação completa':'– fechar',op?'– fechar':'+ classificação completa');return}const t=e.target.closest('[data-ct]');if(t){e.preventDefault();openCt(+t.dataset.ct)}});
const setHH=()=>{try{document.documentElement.style.setProperty('--hh',document.querySelector('.top').offsetHeight+'px')}catch(e){}};setHH();addEventListener('resize',setHH);
render();
</script>
